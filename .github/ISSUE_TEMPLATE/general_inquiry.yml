name: "General Inquiry"
description: "Ask a question about Arliz"
title: "Question: "
labels: ["question"]
body:
  - type: input
    id: question
    attributes:
      label: "What's your question?"
      placeholder: "A clear, specific question."
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: "Context"
      placeholder: "Any background that helps answer the question."
    validations:
      required: false

  - type: input
    id: file
    attributes:
      label: "Related file(s)"
      placeholder: "e.g. volumes/vol3/chapter07/chapter07.tex"
    validations:
      required: false