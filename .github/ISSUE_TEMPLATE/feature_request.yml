name: "Feature Request"
description: "Suggest a new feature or improvement"
title: "Feature: "
labels: ["enhancement"]
body:
  - type: input
    id: summary
    attributes:
      label: "What do you want to add or change?"
      placeholder: "A short description of the feature."
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: "Why is this useful?"
      placeholder: "Explain the problem it solves or the value it adds."
    validations:
      required: true

  - type: input
    id: location
    attributes:
      label: "Where in the book does this apply?"
      placeholder: "e.g. volumes/vol1/chapter05, configs/macros.tex, or N/A"
    validations:
      required: false

  - type: textarea
    id: details
    attributes:
      label: "Additional details"
      placeholder: "Examples, sketches, LaTeX snippets, or references."
    validations:
      required: false