name: "Bug Report"
description: "Report a problem in Arliz"
title: "Bug: "
labels: ["bug"]
body:
  - type: input
    id: description
    attributes:
      label: "What went wrong?"
      placeholder: "A short description of the problem."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: "Steps to reproduce"
      placeholder: |
        1. Open `volumes/vol1/chapter01/chapter01.tex`
        2. Run `make vol1`
        3. See error on line 42
    validations:
      required: true

  - type: input
    id: expected
    attributes:
      label: "What should have happened?"
      placeholder: "Describe the expected behavior."
    validations:
      required: true

  - type: input
    id: actual
    attributes:
      label: "What actually happened?"
      placeholder: "Include any error messages or unexpected output."
    validations:
      required: true

  - type: input
    id: file
    attributes:
      label: "Affected file(s)"
      placeholder: "e.g. volumes/vol1/chapter03/chapter03.tex"
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: "Additional context"
      placeholder: "Logs, screenshots, or anything else that might help."
    validations:
      required: false