name: "Documentation Update"
description: "Suggest a correction or improvement to documentation"
title: "[DOCS] "
labels: ["documentation"]
body:
  - type: input
    id: location
    attributes:
      label: "Which file or section?"
      placeholder: "e.g. docs/CONTRIBUTING.md, volumes/vol1/chapter02/chapter02.tex"
    validations:
      required: true

  - type: textarea
    id: change
    attributes:
      label: "What needs to change and why?"
      placeholder: "Describe the correction or improvement clearly."
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: "Additional context"
      placeholder: "Before/after examples, references, or screenshots."
    validations:
      required: false